[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmind"
version = "0.2.0"
description = "Experimental SQLite-backed persistent memory for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AntoGA"}]
dependencies = ["numpy>=1.24", "pydantic>=2", "tenacity>=8.2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/AntoGA/agentmind"
Issues = "https://github.com/AntoGA/agentmind/issues"

[project.optional-dependencies]
openai = ["openai>=1"]
sentence-transformers = ["sentence-transformers>=2.2"]
dev = ["pytest>=7.4", "build>=1.2", "twine>=6"]

[tool.setuptools.packages.find]
include = ["agentmind", "agentmind.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
