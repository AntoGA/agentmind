name: Package and offline memory tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine
      # build creates the wheel from the sdist, exercising both artifacts.
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/agentmind-installed
      - run: /tmp/agentmind-installed/bin/python -m pip install dist/*.whl pytest
      - name: Test installed wheel outside checkout
        run: |
          mkdir -p /tmp/agentmind-tests
          cp -R tests /tmp/agentmind-tests/tests
          cd /tmp/agentmind-tests
          /tmp/agentmind-installed/bin/python -I -m pytest -q tests --junitxml="$GITHUB_WORKSPACE/test-results.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-python-${{ matrix.python }}
          path: |
            dist/*
            test-results.xml
